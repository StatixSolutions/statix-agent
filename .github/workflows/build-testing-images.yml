name: Build Testing Images

on:
  push:
    tags:
      - "testing-images/**"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve testing image
        id: image
        shell: bash
        run: |
          image="${GITHUB_REF_NAME#testing-images/}"

          if [[ -z "$image" || "$image" == "$GITHUB_REF_NAME" ]]; then
            echo "Tag must match testing-images/<image-name>" >&2
            exit 1
          fi
          if [[ ! "$image" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Invalid testing image name: $image" >&2
            exit 1
          fi
          if [[ ! -f "testing-images/$image/Dockerfile" ]]; then
            echo "Missing testing-images/$image/Dockerfile" >&2
            exit 1
          fi

          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/testing-images/$image:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: testing-images/${{ steps.image.outputs.name }}
          push: true
          tags: ${{ steps.image.outputs.ref }}

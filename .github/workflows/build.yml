name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: x86_64-unknown-linux-gnu
            asset_arch: amd64
            nix_system: x86_64-linux
            runner: ubuntu-latest
          - rust_target: aarch64-unknown-linux-gnu
            asset_arch: arm64
            nix_system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate version metadata
        env:
          GIT_TAG: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg version "${GIT_TAG#v}" \
            --arg commit "$GIT_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, commit: $commit, builtAt: $builtAt}' \
            > version.json

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build release package
        env:
          NIX_SYSTEM: ${{ matrix.nix_system }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: bash scripts/build-release.sh binary

      - name: Package release assets
        run: find dist -maxdepth 4 -type f | sort

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: statix-agent-linux-${{ matrix.asset_arch }}
          path: dist/upload/

  publish-release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate version metadata
        env:
          GIT_TAG: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg version "${GIT_TAG#v}" \
            --arg commit "$GIT_SHA" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, commit: $commit, builtAt: $builtAt}' \
            > version.json

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/upload
          merge-multiple: true

      - name: Generate shared release assets
        run: bash scripts/build-release.sh shared

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] && gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              done
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/upload/*
